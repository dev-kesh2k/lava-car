name: Testes

# Tipos, lint, testes e build em cada push e pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Build (PWA)
        run: npx vite build

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Checagem de tipos das Edge Functions
        working-directory: supabase/functions
        run: deno check create-pix/index.ts mp-webhook/index.ts notify-status/index.ts
