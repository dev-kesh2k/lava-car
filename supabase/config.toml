# Configuração do Supabase CLI para desenvolvimento local (supabase start).
project_id = "lava-car"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.sms]
# Login por telefone/WhatsApp (OTP). Configure o provedor (Twilio/MessageBird/Vonage) no painel.
enable_signup = true
enable_confirmations = true

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[functions.mp-webhook]
# O Mercado Pago não manda JWT do Supabase: a assinatura é conferida dentro da função.
verify_jwt = false
